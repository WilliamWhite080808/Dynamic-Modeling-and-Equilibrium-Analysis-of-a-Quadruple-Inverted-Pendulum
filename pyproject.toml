[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendulum-lab"
version = "1.0.0"
description = "Nonlinear N-link cart pendulum laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "sympy>=1.12,<2", "numba>=0.59,<1", "fastapi>=0.100,<1", "uvicorn>=0.23,<1", "matplotlib>=3.7,<4", "casadi>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["triple_pendulum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
